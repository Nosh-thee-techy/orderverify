# fly.web.toml
# Next.js seller app on Fly.io.
app = "ov-ke-web"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile.web"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
